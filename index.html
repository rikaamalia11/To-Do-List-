<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Tugas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Daftar Tugas</h1>

    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Masukkan tugas...">
        <input type="date" id="deadlineInput">
        <button onclick="addTask()">Tambah</button>
    </div>

    <!-- 🔥 FILTER (DITAMBAHKAN data-filter) -->
    <div class="filter">
        <button onclick="setFilter('all')" data-filter="all">Semua</button>
        <button onclick="setFilter('completed')" data-filter="completed">Selesai</button>
        <button onclick="setFilter('pending')" data-filter="pending">Belum</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
